description.English=The citizens of Greyhaven are having trouble at the cemetary and have posted a generous bounty.  The city is known as a centre of magical learning and things are often more complicated than they appear, which is surely part of the reason for the size of the bounty.
description.Spanish=Los ciudadanos de Greyhaven están teniendo problemas en el cementerio y han puesto una generosa recompensa. La ciudad es conocida como el centro de enseñanza de la magia y a menudo las cosas son más complicadas de lo que parece a simple vista, lo que por otro lado explicaría lo abultada de la suma ofrecida como recompensa.
description.German=Die Bürger von Greyhaven haben Probleme auf dem Friedhof und haben eine großzügige Belohnung ausgesetzt. Die Stadt ist als Zentrum des magischen Lernens bekannt und die Dinge sind oft komplizierter, als sie erscheinen, was sicherlich ein Grund für die Höhe der Belohnung ist.
