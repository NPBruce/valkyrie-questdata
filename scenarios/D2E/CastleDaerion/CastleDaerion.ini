description.English=My own version of Castle Daerion. Based on the original quest but modified to fit the Road to Legend rules/feel. Not playtested for difficulty balance yet (I was aiming for something more on the hard side) but it should work perfectly mechanically. May contain typos as English is not my first language.
description.German=Meine eigene Version von Schloss Daerion. Basierend auf der Originalquest, aber angepasst an die Regeln/das Gefühl von Wege zum Ruhm. Noch nicht auf Schwierigkeitsgrad getestet (ich zielte auf etwas eher Schwieriges ab), aber es sollte mechanisch perfekt funktionieren. Kann Tippfehler enthalten, da Englisch nicht meine Muttersprache ist.
description.Spanish=Esta aventura es mi versión particular de "El castillo Daerion". Basada en la aventura original pero modificada para ajustarse a las reglas y el estilo de la aplicación "Camino a la leyenda". \n\n La he diseñado para que sea más bien difícil pero mecánicamente debería funcionar sin problemas.
